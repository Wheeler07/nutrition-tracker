    <!-- The Restaurant tab's pixel font (free, from Google Fonts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    />
    <script>
      // Apply saved display settings before the page draws so it doesn't
      // flash. The keys match THEME_KEY and COLORBLIND_KEY in src/storage.ts.
      try {
        const theme = localStorage.getItem("nutrition-tracker:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        if (localStorage.getItem("nutrition-tracker:colorblind") === "on") {
          document.documentElement.dataset.palette = "colorblind";
        }
      } catch {
        // Storage is blocked; main.ts shows a warning once the page loads.
      }
    </script>
    <script type="module" crossorigin src="./assets/index-CQkV_20D.js"></script>
